<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Mind - Therapy - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg-color: #050505;
      --card-bg: #111114;
      --card-border: #222228;
      --primary: #9bf00b;
      --primary-hover: #82cc08;
      --primary-text: #050505;
      --warning: #f59e0b;
      --danger: #ef4444;
      --neutral: #6b7280;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --input-bg: #09090b;
      --input-border: #26262e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); }
    .logo-title { font-size: 22px; font-weight: 700; color: var(--primary); }
    
    .connection-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
    }
    .connection-badge.connecting {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--warning);
    }
    .connection-badge.connected {
      color: var(--primary);
      background: rgba(155, 240, 11, 0.12);
      border: 1px solid var(--primary);
    }

    .btn-portal { background: transparent; color: var(--text-main); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }

    .tab-nav { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px; border-radius: 12px; text-align: center; }
    .stat-number { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--text-main); }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .ticket-list, .user-list { display: flex; flex-direction: column; gap: 18px; }
    .ticket-card, .user-card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 6px solid var(--primary); border-radius: 12px; padding: 20px; }
    .ticket-card.cancelled, .ticket-card.closed { border-left-color: var(--danger); }
    .user-card.is-admin { border-left-color: var(--primary); }
    .user-card.is-client { border-left-color: var(--neutral); }

    .ticket-header, .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary-text); background: var(--neutral); }
    .status-badge.accepted, .status-badge.confirmed, .status-badge.admin-role { background: var(--primary); color: var(--primary-text); }
    .status-badge.offered { background: var(--warning); color: #000; }
    .status-badge.cancelled, .status-badge.closed { background: var(--danger); color: #fff; }
    .status-badge.user-role { background: var(--input-border); color: var(--text-muted); }

    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .details-grid span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

    .action-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }
    .action-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
    
    input[type="datetime-local"], input[type="text"] { width: 100%; background: var(--card-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; }

    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--primary-text); }
    .btn-accept { background-color: var(--primary); }
    .btn-offer { background-color: var(--warning); color: #000; }
    .btn-cancel { background-color: var(--danger); color: #fff; }
    .btn-delete { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-delete:hover { background-color: var(--danger); color: #fff; }
    .btn-promote { background-color: var(--primary); color: var(--primary-text); padding: 8px 16px; font-size: 12px; }
    .btn-demote { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); padding: 8px 16px; font-size: 12px; }
    .btn-demote:hover { background-color: var(--warning); color: #000; }

    .chat-layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; height: 520px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
    .user-threads { border-right: 1px solid var(--card-border); overflow-y: auto; }
    .thread-item { padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .thread-item:hover, .thread-item.active { background: var(--input-bg); border-left: 4px solid var(--primary); }
    .thread-email { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--primary); }
    .thread-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

    .green-dot { width: 9px; height: 9px; background-color: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); flex-shrink: 0; }

    .chat-window { display: flex; flex-direction: column; justify-content: space-between; }
    .chat-messages { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 10px; font-size: 13px; }
    .chat-bubble.user { background: var(--input-bg); border: 1px solid var(--card-border); align-self: flex-start; color: var(--text-main); }
    .chat-bubble.admin { background: var(--primary); align-self: flex-end; color: var(--primary-text); font-weight: 600; }
    .chat-input-row { padding: 14px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; background: var(--input-bg); }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="logo-title">🛡️ Drozo Mind - Therapy - Admin Panel</div>
      <span id="admin-connection-status" class="connection-badge connecting">🟡 Connecting...</span>
      <a href="index.html" class="btn-portal">← Client Portal</a>
    </div>
    <button class="btn-portal" style="border-color: var(--danger); color: var(--danger);" onclick="adminSignOut()">Sign Out</button>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('tickets', this)">🎟️ Bookings & Sessions</button>
    <button class="tab-btn" onclick="switchTab('accounts', this)">👥 User Accounts</button>
    <button class="tab-btn" onclick="switchTab('dms', this)">💬 Direct Messages</button>
  </div>

  <!-- BOOKINGS PANEL -->
  <div id="view-tickets" class="view-panel active">
    <div class="stats-bar">
      <div class="stat-card"><div style="color: var(--text-muted); font-size: 11px;">TOTAL TICKETS</div><div class="stat-number" id="stat-total">0</div></div>
      <div class="stat-card"><div style="color: var(--warning); font-size: 11px;">PENDING</div><div class="stat-number" id="stat-pending">0</div></div>
      <div class="stat-card"><div style="color: var(--primary); font-size: 11px;">CONFIRMED</div><div class="stat-number" id="stat-active">0</div></div>
      <div class="stat-card"><div style="color: var(--danger); font-size: 11px;">CLOSED/CANCELLED</div><div class="stat-number" id="stat-closed">0</div></div>
    </div>

    <div id="tickets-list" class="ticket-list"><div class="empty-state">Loading tickets...</div></div>
  </div>

  <!-- ACCOUNTS MANAGEMENT PANEL -->
  <div id="view-accounts" class="view-panel">
    <div class="stats-bar">
      <div class="stat-card"><div style="color: var(--text-muted); font-size: 11px;">TOTAL REGISTERED ACCOUNTS</div><div class="stat-number" id="stat-users-total">0</div></div>
      <div class="stat-card"><div style="color: var(--primary); font-size: 11px;">ADMINISTRATORS</div><div class="stat-number" id="stat-users-admins">0</div></div>
      <div class="stat-card"><div style="color: var(--neutral); font-size: 11px;">CLIENT USERS</div><div class="stat-number" id="stat-users-clients">0</div></div>
    </div>

    <div id="users-list" class="user-list"><div class="empty-state">Loading accounts...</div></div>
  </div>

  <!-- DIRECT MESSAGES PANEL -->
  <div id="view-dms" class="view-panel">
    <div class="chat-layout">
      <div class="user-threads" id="threads-list"><div class="empty-state">Loading support threads...</div></div>
      <div class="chat-window">
        <div class="chat-messages" id="chat-messages-container"><div class="empty-state">Select a conversation thread to view messages.</div></div>
        <div class="chat-input-row">
          <input type="text" id="admin-chat-input" placeholder="Type a response...">
          <button class="btn btn-accept" onclick="sendAdminMessage()">Send DM</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://qhwtjzpqolhslhancngs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Hm0_jgynuWcA01ckhAs1YA_jjJfNmbL";

  const { createClient } = window.supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentAdminId = null;
  let allTickets = [];
  let allProfiles = [];
  let allMessages = [];
  let activeChatUserId = null;

  // Timezone Helper: Formats stored ISO time strings into admin's local timezone (e.g. IST)
  function formatLocalDateTime(isoString) {
    if (!isoString) return 'None';
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString;
    return date.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
  }

  // Guaranteed lookup helper to map User ID to Email
  function getUserEmail(userId) {
    const profile = allProfiles.find(p => p.id === userId);
    if (profile && profile.email) return profile.email;
    return `User (${userId ? userId.substring(0, 8) : 'Unknown'}...)`;
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      alert("Access Denied: Please sign in through the Client Portal first.");
      window.location.href = "index.html";
      return;
    }

    currentAdminId = session.user.id;

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', currentAdminId)
      .single();

    if (!profile || profile.role !== 'admin') {
      alert("⛔ Access Denied: You do not have Administrator permissions.");
      window.location.href = "index.html";
      return;
    }

    // MANDATORY ORDER: Load users first so profiles/emails are available to tickets and chat threads
    await loadUsers();
    await loadTickets();
    await loadDMs();
    setupRealtime();
  }

  async function adminSignOut() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  function switchTab(tabName, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
    btnElement.classList.add('active');
    document.getElementById(`view-${tabName}`).classList.add('active');
  }

  /* ------------------- ACCOUNTS MANAGEMENT ------------------- */
  async function loadUsers() {
    // Note: Querying profiles directly without .order('created_at') prevents column-missing SQL errors
    const { data: profiles, error } = await supabaseClient.from('profiles').select('*');
    if (error) console.error("Error fetching profiles:", error);
    allProfiles = profiles || [];
    renderAccounts();
  }

  function renderAccounts() {
    const container = document.getElementById('users-list');
    container.innerHTML = '';

    const totalUsers = allProfiles.length;
    const adminCount = allProfiles.filter(p => p.role === 'admin').length;
    const clientCount = totalUsers - adminCount;

    document.getElementById('stat-users-total').innerText = totalUsers;
    document.getElementById('stat-users-admins').innerText = adminCount;
    document.getElementById('stat-users-clients').innerText = clientCount;

    if (allProfiles.length === 0) {
      container.innerHTML = `<div class="empty-state">No registered accounts found in the profiles table.</div>`;
      return;
    }

    allProfiles.forEach(user => {
      const isAdmin = user.role === 'admin';
      const isSelf = user.id === currentAdminId;

      const card = document.createElement('div');
      card.className = `user-card ${isAdmin ? 'is-admin' : 'is-client'}`;
      card.innerHTML = `
        <div class="user-header">
          <div>
            <strong style="font-size: 16px;">${user.email || 'No Email Recorded'}</strong>
            ${isSelf ? '<span style="font-size: 11px; color: var(--primary); margin-left: 8px;">(You)</span>' : ''}
          </div>
          <div class="header-actions">
            <span class="status-badge ${isAdmin ? 'admin-role' : 'user-role'}">${isAdmin ? '🛡️ Administrator' : '👤 Client'}</span>
            ${isAdmin ? 
              `<button class="btn btn-demote" ${isSelf ? 'disabled style="opacity:0.5; cursor:not-allowed;" title="You cannot demote yourself"' : ''} onclick="updateUserRole('${user.id}', 'user')">Demote to Client</button>` : 
              `<button class="btn btn-promote" onclick="updateUserRole('${user.id}', 'admin')">👑 Make Admin</button>`
            }
          </div>
        </div>
        <div class="details-grid" style="margin-bottom:0;">
          <div><span>Registered Email</span><strong style="color: var(--primary);">${user.email || 'No Email Recorded'}</strong></div>
          <div><span>User ID</span><strong style="font-family:monospace; font-size:11px;">${user.id}</strong></div>
          <div><span>System Role</span><strong>${user.role || 'user'}</strong></div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  async function updateUserRole(userId, newRole) {
    if (userId === currentAdminId && newRole === 'user') {
      return alert("Action blocked: You cannot demote your own active admin account.");
    }

    const actionText = newRole === 'admin' ? 'promote this user to Administrator' : 'demote this user to Client';
    if (!confirm(`Are you sure you want to ${actionText}?`)) return;

    const { error } = await supabaseClient
      .from('profiles')
      .update({ role: newRole })
      .eq('id', userId);

    if (error) {
      alert("Failed to update role: " + error.message);
    } else {
      await loadUsers();
      renderTickets();
    }
  }

  /* ------------------- TICKET MANAGEMENT ------------------- */
  async function loadTickets() {
    const { data: tickets } = await supabaseClient.from('tickets').select('*').order('created_at', { ascending: false });
    allTickets = tickets || [];
    updateTicketStats();
    renderTickets();
  }

  function updateTicketStats() {
    document.getElementById('stat-total').innerText = allTickets.length;
    document.getElementById('stat-pending').innerText = allTickets.filter(t => (t.status || '').toLowerCase().includes('submit')).length;
    document.getElementById('stat-active').innerText = allTickets.filter(t => t.status === 'Accepted' || t.status === 'Confirmed').length;
    document.getElementById('stat-closed').innerText = allTickets.filter(t => t.status === 'Closed' || t.status === 'Cancelled').length;
  }

  function renderTickets() {
    const container = document.getElementById('tickets-list');
    container.innerHTML = '';

    if (allTickets.length === 0) {
      container.innerHTML = `<div class="empty-state">No session tickets found.</div>`;
      return;
    }

    allTickets.forEach(ticket => {
      const userEmail = getUserEmail(ticket.user_id);
      const statusKey = (ticket.status || 'Submitted').toLowerCase();

      const card = document.createElement('div');
      card.className = `ticket-card ${statusKey}`;
      card.innerHTML = `
        <div class="ticket-header">
          <strong style="font-size: 16px;">Ticket #TCK-${ticket.ticket_number}</strong>
          <div class="header-actions">
            <span class="status-badge ${statusKey}">${ticket.status}</span>
            <button class="btn btn-delete" onclick="deleteTicket('${ticket.id}')">🗑️ Delete</button>
          </div>
        </div>

        <div class="details-grid">
          <div><span>Client Email</span><strong style="color:var(--primary);">${userEmail}</strong></div>
          <div><span>Discord Handle</span><strong style="color:#5865F2;">🎮 ${ticket.discord_username || 'Not Provided'}</strong></div>
          <div><span>Requested Time</span><strong>${formatLocalDateTime(ticket.pref_time)}</strong></div>
          <div><span>Offered Slot</span><strong>${formatLocalDateTime(ticket.offered_time)}</strong></div>
          <div><span>Confirmed Time</span><strong style="color: var(--primary);">${formatLocalDateTime(ticket.accepted_time)}</strong></div>
          <div><span>1-Time Discord Link</span><strong style="color:#5865F2; word-break:break-all;">${ticket.discord_link || 'Not Generated'}</strong></div>
        </div>

        <div class="action-box">
          <div class="action-row">
            <div><label>Accept Slot Directly & Attach Invite:</label><span>${formatLocalDateTime(ticket.pref_time || ticket.offered_time)}</span></div>
            <button class="btn btn-accept" onclick="acceptTicket('${ticket.id}', '${ticket.pref_time || ticket.offered_time || ''}')">Accept & Send Link</button>
          </div>
          <hr style="border:0; border-top:1px solid var(--card-border); margin:12px 0;">
          <div class="action-row">
            <div><label>Offer Alternative Time (Local Time):</label><input type="datetime-local" id="slot-picker-${ticket.id}"></div>
            <button class="btn btn-offer" style="margin-top:16px;" onclick="offerNewSlot('${ticket.id}', ${ticket.negotiation_count || 0})">Offer Time</button>
          </div>
          <hr style="border:0; border-top:1px solid var(--card-border); margin:12px 0;">
          <div class="action-row">
            <div><label>Close Session (Reason):</label><input type="text" id="cancel-reason-${ticket.id}" placeholder="Specify reason..."></div>
            <button class="btn btn-cancel" style="margin-top:16px;" onclick="closeBooking('${ticket.id}')">Close Session</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  async function acceptTicket(ticketId, chosenTime) {
    if (!chosenTime) return alert("No time slot selected.");

    const discordLink = prompt("Paste the 1-time Discord Invite Link for this session:");
    if (!discordLink) return alert("Confirmation cancelled: A Discord invite link is required.");

    const { error } = await supabaseClient
      .from('tickets')
      .update({ 
        status: 'Confirmed', 
        accepted_time: chosenTime,
        discord_link: discordLink.trim()
      })
      .eq('id', ticketId);

    if (error) {
      alert("Failed to confirm booking: " + error.message);
    } else {
      alert("Booking confirmed and 1-time Discord link attached!");
      loadTickets();
    }
  }

  async function offerNewSlot(ticketId, currentCount) {
    const val = document.getElementById(`slot-picker-${ticketId}`).value;
    if (!val) return alert("Select date/time first.");

    const isoTime = new Date(val).toISOString();
    const newCount = currentCount + 1;

    if (newCount >= 2) {
      await supabaseClient.from('tickets').update({
        status: 'Cancelled',
        admin_comment: 'Auto-cancelled: Reached maximum negotiation limit (2 attempts).',
        negotiation_count: newCount
      }).eq('id', ticketId);
    } else {
      await supabaseClient.from('tickets').update({
        status: 'Slot Offered',
        offered_time: isoTime,
        negotiation_count: newCount
      }).eq('id', ticketId);
    }
    loadTickets();
  }

  async function closeBooking(ticketId) {
    const reason = document.getElementById(`cancel-reason-${ticketId}`).value.trim() || 'Session closed by administrator.';
    await supabaseClient.from('tickets').update({ status: 'Closed', admin_comment: reason }).eq('id', ticketId);
    loadTickets();
  }

  async function deleteTicket(ticketId) {
    if (!confirm("Are you sure you want to permanently delete this ticket record?")) return;
    const { error } = await supabaseClient.from('tickets').delete().eq('id', ticketId);
    if (error) alert("Failed to delete ticket: " + error.message);
    else loadTickets();
  }

  /* ------------------- DIRECT MESSAGES ------------------- */
  async function loadDMs() {
    const { data: msgs } = await supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: true });
    allMessages = msgs || [];
    renderThreads();
    if (activeChatUserId) renderChatWindow(activeChatUserId);
  }

  function renderThreads() {
    const container = document.getElementById('threads-list');
    container.innerHTML = '';

    const userMap = {};
    allMessages.forEach(m => {
      if (!userMap[m.user_id]) userMap[m.user_id] = [];
      userMap[m.user_id].push(m);
    });

    const userIds = Object.keys(userMap);
    if (userIds.length === 0) {
      container.innerHTML = `<div class="empty-state">No chat messages yet.</div>`;
      return;
    }

    userIds.forEach(uId => {
      const msgs = userMap[uId];
      const lastMsg = msgs[msgs.length - 1];
      const userEmailDisplay = getUserEmail(uId);
      const hasUnread = msgs.some(m => m.sender_role === 'user' && m.status === 'unread');

      const item = document.createElement('div');
      item.className = `thread-item ${activeChatUserId === uId ? 'active' : ''}`;
      item.onclick = () => selectThread(uId);
      item.innerHTML = `
        <div style="overflow: hidden;">
          <div class="thread-email" title="${userEmailDisplay}">${userEmailDisplay}</div>
          <div class="thread-preview">${lastMsg.message}</div>
        </div>
        ${hasUnread ? `<span class="green-dot" title="Unread Message"></span>` : ''}
      `;
      container.appendChild(item);
    });
  }

  async function selectThread(userId) {
    activeChatUserId = userId;
    await supabaseClient
      .from('chat_messages')
      .update({ status: 'read' })
      .eq('user_id', userId)
      .eq('sender_role', 'user')
      .eq('status', 'unread');
    loadDMs();
  }

  function renderChatWindow(userId) {
    const container = document.getElementById('chat-messages-container');
    container.innerHTML = '';
    const userMsgs = allMessages.filter(m => m.user_id === userId);

    userMsgs.forEach(m => {
      const bubble = document.createElement('div');
      const isAdmin = m.sender_role === 'admin';
      bubble.className = `chat-bubble ${isAdmin ? 'admin' : 'user'}`;
      bubble.innerText = m.message;
      container.appendChild(bubble);
    });
    container.scrollTop = container.scrollHeight;
  }

  async function sendAdminMessage() {
    if (!activeChatUserId) return alert("Select a conversation thread first.");
    const input = document.getElementById('admin-chat-input');
    const msg = input.value.trim();
    if (!msg) return;

    await supabaseClient.from('chat_messages').insert([{
      user_id: activeChatUserId,
      sender_role: 'admin',
      message: msg,
      status: 'unread'
    }]);

    input.value = '';
    loadDMs();
  }

  /* ------------------- REALTIME SUBSCRIPTIONS ------------------- */
  function setupRealtime() {
    const connBadge = document.getElementById('admin-connection-status');

    supabaseClient.channel('admin-realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => loadTickets())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadUsers())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, () => loadDMs())
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          connBadge.className = 'connection-badge connected';
          connBadge.innerHTML = '🟢 Connected';
        } else {
          connBadge.className = 'connection-badge connecting';
          connBadge.innerHTML = '🟡 Connecting...';
        }
      });
  }

  init();
</script>
</body>
</html>
