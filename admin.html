<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Mind - Therapy - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg-color: #050505;
      --card-bg: #111114;
      --card-border: #222228;
      --primary: #9bf00b;
      --primary-hover: #82cc08;
      --primary-text: #050505;
      --warning: #f59e0b;
      --danger: #ef4444;
      --neutral: #6b7280;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --input-bg: #09090b;
      --input-border: #26262e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); }
    .logo-title { font-size: 22px; font-weight: 700; color: var(--primary); }
    
    .connection-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
    }
    .connection-badge.connecting {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--warning);
    }
    .connection-badge.connected {
      color: var(--primary);
      background: rgba(155, 240, 11, 0.12);
      border: 1px solid var(--primary);
    }

    .btn-portal { background: transparent; color: var(--text-main); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }

    .tab-nav { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px; border-radius: 12px; text-align: center; }
    .stat-number { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--text-main); }

    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .ticket-list, .user-list { display: flex; flex-direction: column; gap: 18px; }
    .ticket-card, .user-card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 6px solid var(--primary); border-radius: 12px; padding: 20px; }
    .ticket-card.cancelled, .ticket-card.closed { border-left-color: var(--danger); }
    .user-card.is-admin { border-left-color: var(--primary); }
    .user-card.is-client { border-left-color: var(--neutral); }

    .ticket-header, .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary-text); background: var(--neutral); }
    .status-badge.accepted, .status-badge.admin-role { background: var(--primary); color: var(--primary-text); }
    .status-badge.offered { background: var(--warning); color: #000; }
    .status-badge.cancelled, .status-badge.closed { background: var(--danger); color: #fff; }
    .status-badge.user-role { background: var(--input-border); color: var(--text-muted); }

    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .details-grid span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

    .action-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }
    .action-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
    
    input[type="datetime-local"], input[type="text"] { width: 100%; background: var(--card-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; }

    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--primary-text); }
    .btn-accept { background-color: var(--primary); }
    .btn-offer { background-color: var(--warning); color: #000; }
    .btn-cancel { background-color: var(--danger); color: #fff; }
    .btn-delete { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .btn-delete:hover { background-color: var(--danger); color: #fff; }
    .btn-promote { background-color: var(--primary); color: var(--primary-text); padding: 8px 16px; font-size: 12px; }
    .btn-demote { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); padding: 8px 16px; font-size: 12px; }
    .btn-demote:hover { background-color: var(--warning); color: #000; }

    .chat-layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; height: 520px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
    .user-threads { border-right: 1px solid var(--card-border); overflow-y: auto; }
    .thread-item { padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .thread-item:hover, .thread-item.active { background: var(--input-bg); border-left: 4px solid var(--primary); }
    .thread-email { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: var(--primary); }
    .thread-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

    .green-dot { width: 9px; height: 9px; background-color: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); flex-shrink: 0; }

    .chat-window { display: flex; flex-direction: column; justify-content: space-between; }
    .chat-messages { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 10px; font-size: 13px; }
    .chat-bubble.user { background: var(--input-bg); border: 1px solid var(--card-border); align-self: flex-start; color: var(--text-main); }
    .chat-bubble.admin { background: var(--primary); align-self: flex-end; color: var(--primary-text); font-weight: 600; }
    .chat-input-row { padding: 14px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; background: var(--input-bg); }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="logo-title">🛡️ Drozo Mind - Therapy - Admin Panel</div>
      <span id="admin-connection-status" class="connection-badge connecting">🟡 Connecting...</span>
      <a href="index.html" class="btn-portal">← Client Portal</a>
    </div>
    <button class="btn-portal" style="border-color: var(--danger); color: var(--danger);" onclick="adminSignOut()">Sign Out</button>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('tickets', this)">🎟️ Bookings & Sessions</button>
    <button class="tab-btn" onclick="switchTab('accounts', this)">👥 User Accounts</button>
    <button class="tab-btn" onclick="switchTab('dms', this)">💬 Direct Messages</button>
  </div>

  <!-- BOOKINGS PANEL -->
  <div id="view-tickets" class="view-panel active">
    <div class="stats-bar">
      <div class="stat-card"><div style="color: var(--text-muted); font-size: 11px;">TOTAL TICKETS</div><div class="stat-number" id="stat-total">0</div></div>
      <div class="stat-card"><div style="color: var(--warning); font-size: 11px;">PENDING</div><div class="stat-number" id="stat-pending">0</div></div>
      <div class="stat-card"><div style="color: var(--primary); font-size: 11px;">CONFIRMED</div><div class="stat-number" id="stat-active">0</div></div>
      <div class="stat-card"><div style="color: var(--danger); font-size: 11px;">CLOSED/CANCELLED</div><div class="stat-number" id="stat-closed">0</div></div>
    </div>

    <div id="tickets-list" class="ticket-list"><div class="empty-state">Loading tickets...</div></div>
  </div>

  <!-- ACCOUNTS MANAGEMENT PANEL -->
  <div id="view-accounts" class="view-panel">
    <div class="stats-bar">
      <div class="stat-card"><div style="color: var(--text-muted); font-size: 11px;">TOTAL REGISTERED ACCOUNTS</div><div class="stat-number" id="stat-users-total">0</div></div>
      <div class="stat-card"><div style="color: var(--primary); font-size: 11px;">ADMINISTRATORS</div><div class="stat-number" id="stat-users-admins">0</div></div>
      <div class="stat-card"><div style="color: var(--neutral); font-size: 11px;">CLIENT USERS</div><div class="stat-number" id="stat-users-clients">0</div></div>
    </div>

    <div id="users-list" class="user-list"><div class="empty-state">Loading accounts...</div></div>
  </div>

  <!-- DIRECT MESSAGES PANEL -->
  <div id="view-dms" class="view-panel">
    <div class="chat-layout">
      <div class="user-threads" id="threads-list"><div class="empty-state">Loading support threads...</div></div>
      <div class="chat-window">
        <div class="chat-messages" id="chat-messages-container"><div class="empty-state">Select a conversation thread to view messages.</div></div>
        <div class="chat-input-row">
          <input type="text" id="admin-chat-input" placeholder="Type a response...">
          <button class="btn btn-accept" onclick="sendAdminMessage()">Send DM</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // SUPABASE CONFIGURATION
  const SUPABASE_URL = "https://qhwtjzpqolhslhancngs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Hm0_jgynuWcA01ckhAs1YA_jjjFNmbL";

  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentAdmin = null;
  let selectedChatUserId = null;
  let unreadUsers = new Set();

  // --- TIMEZONE FORMATTING ---
  function formatLocalDate(isoString) {
    if (!isoString) return 'N/A';
    const date = new Date(isoString);
    return date.toLocaleString(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  // --- TAB NAVIGATION ---
  window.switchTab = function(tabName, btnElement) {
    document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    const activePanel = document.getElementById(`view-${tabName}`);
    if (activePanel) activePanel.classList.add('active');
    if (btnElement) btnElement.classList.add('active');
  };

  // --- AUTHENTICATION & SESSION MANAGEMENT ---
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      verifyAdminAccess(session.user);
    } else {
      redirectToLogin();
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        verifyAdminAccess(session.user);
      } else {
        redirectToLogin();
      }
    });
  });

  async function verifyAdminAccess(user) {
    const { data: profile } = await supabase
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    const isAdmin = (profile && profile.role === 'admin') || user.email === 'aviatorrudra@gmail.com';

    if (!isAdmin) {
      alert("Access Denied: Admin privileges required.");
      await supabase.auth.signOut();
      redirectToLogin();
      return;
    }

    currentAdmin = user;
    loadDashboardData();
    subscribeRealtime();
  }

  function redirectToLogin() {
    window.location.href = 'index.html';
  }

  window.adminSignOut = async function() {
    await supabase.auth.signOut();
    redirectToLogin();
  };

  // --- DASHBOARD DATA LOADER ---
  async function loadDashboardData() {
    await Promise.all([
      loadTickets(),
      loadUserAccounts(),
      loadChatThreads()
    ]);
  }

  // --- TICKETS MANAGEMENT ---
  async function loadTickets() {
    const { data: tickets, error } = await supabase
      .from('tickets')
      .select('*')
      .order('created_at', { ascending: false });

    const container = document.getElementById('tickets-list');
    if (error || !container) return;

    // Update Stats
    document.getElementById('stat-total').innerText = tickets.length;
    document.getElementById('stat-pending').innerText = tickets.filter(t => t.status === 'submitted' || t.status === 'slot_offered').length;
    document.getElementById('stat-active').innerText = tickets.filter(t => t.status === 'accepted' || t.status === 'confirmed').length;
    document.getElementById('stat-closed').innerText = tickets.filter(t => t.status === 'closed' || t.status === 'cancelled').length;

    if (tickets.length === 0) {
      container.innerHTML = `<div class="empty-state">No consultation bookings submitted yet.</div>`;
      return;
    }

    container.innerHTML = tickets.map(ticket => `
      <div class="ticket-card ${ticket.status}">
        <div class="ticket-header">
          <div>
            <span style="font-weight:700; font-size:14px; color:var(--primary);">Ticket #${ticket.id.slice(0, 8)}</span>
            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">User: <strong>${ticket.user_email || 'N/A'}</strong></div>
          </div>
          <div class="header-actions">
            <span class="status-badge ${ticket.status}">${ticket.status.replace('_', ' ')}</span>
            <button class="btn-delete" onclick="deleteTicket('${ticket.id}')">Delete</button>
          </div>
        </div>

        <div class="details-grid">
          <div><span>Requested On</span>${formatLocalDate(ticket.created_at)}</div>
          <div><span>Offered Slot</span>${ticket.offered_slot ? formatLocalDate(ticket.offered_slot) : 'Not Offered Yet'}</div>
          <div><span>Client Notes</span>${ticket.notes || 'None provided'}</div>
        </div>

        <div class="action-box">
          <div class="action-row">
            <input type="datetime-local" id="slot-input-${ticket.id}" />
            <button class="btn btn-offer" onclick="offerSlot('${ticket.id}')">Offer Slot</button>
          </div>
          <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
            <button class="btn btn-accept" onclick="updateTicketStatus('${ticket.id}', 'confirmed')">Confirm Booking</button>
            <button class="btn btn-cancel" onclick="updateTicketStatus('${ticket.id}', 'closed')">Close Ticket</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.offerSlot = async function(ticketId) {
    const input = document.getElementById(`slot-input-${ticketId}`);
    if (!input || !input.value) return alert("Please select a valid date and time slot first.");

    const isoSlot = new Date(input.value).toISOString();

    const { error } = await supabase
      .from('tickets')
      .update({ offered_slot: isoSlot, status: 'slot_offered' })
      .eq('id', ticketId);

    if (error) alert("Error offering slot: " + error.message);
    else loadTickets();
  };

  window.updateTicketStatus = async function(ticketId, status) {
    const { error } = await supabase
      .from('tickets')
      .update({ status: status })
      .eq('id', ticketId);

    if (error) alert("Error updating ticket: " + error.message);
    else loadTickets();
  };

  window.deleteTicket = async function(ticketId) {
    if (!confirm("Are you sure you want to permanently delete this ticket?")) return;

    const { error } = await supabase.from('tickets').delete().eq('id', ticketId);
    if (error) alert("Error deleting ticket: " + error.message);
    else loadTickets();
  };

  // --- ACCOUNTS MANAGEMENT ---
  async function loadUserAccounts() {
    const { data: profiles, error } = await supabase
      .from('profiles')
      .select('*')
      .order('created_at', { ascending: false });

    const container = document.getElementById('users-list');
    if (error || !container) return;

    const admins = profiles.filter(p => p.role === 'admin').length;
    const clients = profiles.length - admins;

    document.getElementById('stat-users-total').innerText = profiles.length;
    document.getElementById('stat-users-admins').innerText = admins;
    document.getElementById('stat-users-clients').innerText = clients;

    if (profiles.length === 0) {
      container.innerHTML = `<div class="empty-state">No registered accounts found.</div>`;
      return;
    }

    container.innerHTML = profiles.map(user => `
      <div class="user-card ${user.role === 'admin' ? 'is-admin' : 'is-client'}">
        <div class="user-header">
          <div>
            <div style="font-weight:700; font-size:14px; color:var(--text-main);">${user.email}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">ID: ${user.id}</div>
          </div>
          <div class="header-actions">
            <span class="status-badge ${user.role === 'admin' ? 'admin-role' : 'user-role'}">${user.role || 'user'}</span>
            ${user.role === 'admin' 
              ? `<button class="btn btn-demote" onclick="updateUserRole('${user.id}', 'user')">Demote to User</button>`
              : `<button class="btn btn-promote" onclick="updateUserRole('${user.id}', 'admin')">Promote to Admin</button>`
            }
          </div>
        </div>
      </div>
    `).join('');
  }

  window.updateUserRole = async function(userId, newRole) {
    const { error } = await supabase
      .from('profiles')
      .update({ role: newRole })
      .eq('id', userId);

    if (error) alert("Failed to update role: " + error.message);
    else loadUserAccounts();
  };

  // --- SUPPORT CHAT & DM MANAGEMENT ---
  async function loadChatThreads() {
    const { data: messages, error } = await supabase
      .from('chat_messages')
      .select('*')
      .order('created_at', { ascending: false });

    const threadsContainer = document.getElementById('threads-list');
    if (error || !threadsContainer) return;

    if (messages.length === 0) {
      threadsContainer.innerHTML = `<div class="empty-state">No support threads found.</div>`;
      return;
    }

    // Group messages by user_id
    const userMap = {};
    messages.forEach(msg => {
      if (!userMap[msg.user_id]) {
        userMap[msg.user_id] = msg;
      }
    });

    threadsContainer.innerHTML = Object.keys(userMap).map(userId => {
      const lastMsg = userMap[userId];
      const hasUnread = unreadUsers.has(userId);

      return `
        <div class="thread-item ${selectedChatUserId === userId ? 'active' : ''}" onclick="selectChatThread('${userId}')">
          <div>
            <div class="thread-email">Client ID: ${userId.slice(0, 8)}...</div>
            <div class="thread-preview">${lastMsg.message}</div>
          </div>
          ${hasUnread ? `<div class="green-dot"></div>` : ''}
        </div>
      `;
    }).join('');
  }

  window.selectChatThread = async function(userId) {
    selectedChatUserId = userId;
    unreadUsers.delete(userId);
    loadChatThreads();

    const { data: messages, error } = await supabase
      .from('chat_messages')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: true });

    const chatContainer = document.getElementById('chat-messages-container');
    if (error || !chatContainer) return;

    if (messages.length === 0) {
      chatContainer.innerHTML = `<div class="empty-state">No messages in this thread yet.</div>`;
      return;
    }

    chatContainer.innerHTML = messages.map(msg => {
      const isAdmin = msg.sender_id === currentAdmin.id;
      return `
        <div class="chat-bubble ${isAdmin ? 'admin' : 'user'}">
          ${msg.message}
          <div style="font-size:9px; opacity:0.7; margin-top:4px; text-align:right;">${formatLocalDate(msg.created_at)}</div>
        </div>
      `;
    }).join('');

    chatContainer.scrollTop = chatContainer.scrollHeight;
  };

  window.sendAdminMessage = async function() {
    if (!selectedChatUserId) return alert("Select a chat thread first.");

    const input = document.getElementById('admin-chat-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text || !currentAdmin) return;

    const { error } = await supabase.from('chat_messages').insert([{
      user_id: selectedChatUserId,
      sender_id: currentAdmin.id,
      message: text
    }]);

    if (error) {
      alert("Failed to send message: " + error.message);
    } else {
      input.value = '';
      selectChatThread(selectedChatUserId);
    }
  };

  // --- REALTIME SUBSCRIPTION & CONNECTION STATUS ---
  function subscribeRealtime() {
    const badge = document.getElementById('admin-connection-status');

    supabase
      .channel('admin-realtime-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => {
        loadTickets();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        if (payload.new.user_id === selectedChatUserId) {
          selectChatThread(selectedChatUserId);
        } else {
          unreadUsers.add(payload.new.user_id);
          loadChatThreads();
        }
      })
      .subscribe((status) => {
        if (badge) {
          if (status === 'SUBSCRIBED') {
            badge.className = 'connection-badge connected';
            badge.innerHTML = '🟢 Connected';
          } else {
            badge.className = 'connection-badge connecting';
            badge.innerHTML = '🟡 Connecting...';
          }
        }
      });
  }
</script>
</body>
</html>
