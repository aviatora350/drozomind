<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drozo Mind Therapy - Admin Panel</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Enforces native dark calendar popups & browser controls */
      color-scheme: dark;

      --bg-color: #050505;           /* Pitch Black Background */
      --card-bg: #111114;            /* Dark Charcoal Card */
      --card-border: #222228;        /* Subtle Border */
      --primary: #9bf00b;            /* Drozo Lime Green Accent */
      --primary-hover: #82cc08;      /* Slightly Darker Lime Hover */
      --primary-text: #050505;       /* Black text inside lime buttons */
      --success: #9bf00b;            /* Active / Connected Lime */
      --warning: #f59e0b;            /* Pending Amber */
      --danger: #ef4444;             /* Cancelled / Remove Red */
      --neutral: #6b7280;            /* Closed Gray */
      --text-main: #ffffff;          /* Pure White Text */
      --text-muted: #9ca3af;         /* Soft Gray Subtext */
      --input-bg: #09090b;           /* Input Background */
      --input-border: #26262e;       /* Input Border */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 24px; }

    .container { max-width: 1200px; margin: 0 auto; }

    /* Fix Chrome/Safari Browser Autofill Turning Inputs White */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text-main) !important;
      -webkit-box-shadow: 0 0 0px 1000px var(--input-bg) inset !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* Header Nav */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-title { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; color: var(--primary); }
    .btn-portal { background: transparent; color: var(--text-main); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .btn-portal:hover { background: var(--primary); color: var(--primary-text); }

    /* Navigation Tabs */
    .tab-nav { display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid var(--card-border); padding-bottom: 14px; }
    .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    
    .badge-count { background: var(--danger); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; display: none; }
    .badge-count.show { display: inline-block; }

    /* Stats Bar */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 18px; border-radius: 12px; text-align: center; }
    .stat-number { font-size: 26px; font-weight: 800; margin-top: 6px; color: var(--text-main); }

    /* Content Views */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Ticket Cards */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

    .ticket-list { display: flex; flex-direction: column; gap: 18px; }
    .ticket-card { background: var(--card-bg); border: 1px solid var(--card-border); border-left: 6px solid var(--primary); border-radius: 12px; padding: 20px; }
    .ticket-card.accepted { border-left-color: var(--primary); }
    .ticket-card.offered { border-left-color: var(--warning); }
    .ticket-card.cancelled { border-left-color: var(--danger); }
    .ticket-card.closed { border-left-color: var(--neutral); }

    .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary-text); background: var(--neutral); }
    .status-badge.accepted { background: var(--primary); }
    .status-badge.offered { background: var(--warning); }
    .status-badge.cancelled { background: var(--danger); color: #fff; }

    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: var(--input-bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .details-grid span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

    /* Form & Action Controls */
    .action-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; }
    .action-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
    .action-row:last-child { margin-bottom: 0; }
    label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
    input[type="datetime-local"], input[type="text"] { width: 100%; background: var(--card-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; }
    input:focus { border-color: var(--primary); }

    /* Buttons */
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--primary-text); transition: all 0.2s; white-space: nowrap; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-accept { background-color: var(--primary); }
    .btn-offer { background-color: var(--warning); color: #000; }
    .btn-cancel { background-color: var(--danger); color: #fff; }
    .btn-close { background-color: var(--neutral); color: #fff; }
    .btn-role { background-color: var(--primary); }
    .btn-role.demote { background-color: var(--danger); color: #fff; }

    /* DM Chat Layout */
    .chat-layout { display: grid; grid-template-columns: 300px 1fr; gap: 16px; height: 520px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
    .user-threads { border-right: 1px solid var(--card-border); overflow-y: auto; }
    .thread-item { padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; transition: background 0.2s; }
    .thread-item:hover, .thread-item.active { background: var(--input-bg); border-left: 4px solid var(--primary); }
    .thread-email { font-weight: 700; font-size: 13px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .thread-preview { font-size: 12px; color: var(--text-muted); }

    .chat-window { display: flex; flex-direction: column; justify-content: space-between; }
    .chat-messages { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .chat-bubble { max-width: 75%; padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
    .chat-bubble.user { background: var(--input-bg); border: 1px solid var(--card-border); align-self: flex-start; color: var(--text-main); }
    .chat-bubble.admin { background: var(--primary); align-self: flex-end; color: var(--primary-text); font-weight: 600; }
    .chat-sender-info { font-size: 10px; opacity: 0.75; margin-bottom: 4px; display: block; }
    .chat-input-row { padding: 14px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; background: var(--input-bg); }

    /* Users Table */
    .user-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--card-border); }
    .user-table th, .user-table td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--card-border); font-size: 13px; }
    .user-table th { background: var(--input-bg); color: var(--text-muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo-title">
        🛡️ Drozo Mind Therapy
      </div>
      <a href="index.html" class="btn-portal">← Client Portal</a>
    </div>
    <span id="connection-status" style="font-size: 12px; color: var(--warning); font-weight: 600;">● Connecting...</span>
  </header>

  <!-- Navigation Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('tickets', this)">
      🎟️ Bookings & Sessions
    </button>
    <button class="tab-btn" onclick="switchTab('dms', this)">
      💬 Direct Messages
      <span id="dm-notification-badge" class="badge-count">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('users', this)">
      👥 Registered Users & Roles
    </button>
  </div>

  <!-- TAB 1: TICKETS DASHBOARD -->
  <div id="view-tickets" class="view-panel active">
    <div class="stats-bar">
      <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 11px;">TOTAL TICKETS</div>
        <div class="stat-number" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--warning); font-size: 11px;">PENDING</div>
        <div class="stat-number" id="stat-pending">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--primary); font-size: 11px;">CONFIRMED/ACTIVE</div>
        <div class="stat-number" id="stat-active">0</div>
      </div>
      <div class="stat-card">
        <div style="color: var(--neutral); font-size: 11px;">CLOSED</div>
        <div class="stat-number" id="stat-closed">0</div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setTicketFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setTicketFilter('pending', this)">Pending</button>
      <button class="filter-btn" onclick="setTicketFilter('accepted', this)">Accepted</button>
      <button class="filter-btn" onclick="setTicketFilter('offered', this)">Offered</button>
      <button class="filter-btn" onclick="setTicketFilter('closed', this)">Closed</button>
    </div>

    <div id="tickets-list" class="ticket-list">
      <div class="empty-state">Loading booking requests...</div>
    </div>
  </div>

  <!-- TAB 2: DIRECT MESSAGES -->
  <div id="view-dms" class="view-panel">
    <div class="chat-layout">
      <div class="user-threads" id="threads-list">
        <div class="empty-state">Loading message threads...</div>
      </div>
      <div class="chat-window">
        <div class="chat-messages" id="chat-messages-container">
          <div class="empty-state">Select a user thread on the left to start messaging.</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="admin-chat-input" placeholder="Type your response to the client...">
          <button class="btn btn-accept" onclick="sendAdminMessage()">Send DM</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 3: USER MANAGEMENT & ADMIN ROLES -->
  <div id="view-users" class="view-panel">
    <table class="user-table">
      <thead>
        <tr>
          <th>User Email</th>
          <th>User ID</th>
          <th>Current Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <tr><td colspan="4" class="empty-state">Loading registered profiles...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // ========================================================
  // 1. SUPABASE CLIENT SETUP (Your Exact Credentials)
  // ========================================================
  const SUPABASE_URL = "https://qhwtjzpqolhslhancngs.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Hm0_jgynuWcA01ckhAs1YA_jjJfNmbL";

  const { createClient } = window.supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allTickets = [];
  let allProfiles = [];
  let allMessages = [];
  let currentTicketFilter = 'all';
  let activeChatUserId = null;

  // ========================================================
  // 2. TAB SWITCHING
  // ========================================================
  function switchTab(tabName, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));

    btnElement.classList.add('active');
    document.getElementById(`view-${tabName}`).classList.add('active');

    if (tabName === 'dms') {
      const badge = document.getElementById('dm-notification-badge');
      badge.classList.remove('show');
      badge.innerText = '0';
    }
  }

  // ========================================================
  // 3. TICKETS MANAGEMENT
  // ========================================================
  async function loadTickets() {
    const { data: tickets, error } = await supabaseClient
      .from('tickets')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('tickets-list').innerHTML = `<div class="empty-state">Error loading tickets: ${error.message}</div>`;
      return;
    }

    allTickets = tickets || [];
    updateTicketStats();
    renderTickets();
  }

  function updateTicketStats() {
    document.getElementById('stat-total').innerText = allTickets.length;
    document.getElementById('stat-pending').innerText = allTickets.filter(t => (t.status || '').toLowerCase().includes('pending')).length;
    document.getElementById('stat-active').innerText = allTickets.filter(t => t.status === 'Accepted').length;
    document.getElementById('stat-closed').innerText = allTickets.filter(t => t.status === 'Closed').length;
  }

  function setTicketFilter(filter, el) {
    currentTicketFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderTickets();
  }

  function renderTickets() {
    const container = document.getElementById('tickets-list');
    container.innerHTML = '';

    const filtered = allTickets.filter(t => {
      const s = (t.status || '').toLowerCase();
      if (currentTicketFilter === 'all') return true;
      if (currentTicketFilter === 'pending') return s.includes('pending');
      if (currentTicketFilter === 'accepted') return s === 'accepted';
      if (currentTicketFilter === 'offered') return s.includes('offered') || s.includes('slot');
      if (currentTicketFilter === 'closed') return s === 'closed' || s === 'cancelled';
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">No tickets found under "${currentTicketFilter}".</div>`;
      return;
    }

    filtered.forEach(ticket => {
      const statusKey = getStatusKey(ticket.status);
      const userProfile = allProfiles.find(p => p.id === ticket.user_id);
      const userEmail = userProfile ? userProfile.email : ticket.user_id;

      const card = document.createElement('div');
      card.className = `ticket-card ${statusKey}`;
      card.innerHTML = `
        <div class="ticket-header">
          <strong style="font-size: 16px;">Ticket #${ticket.ticket_number}</strong>
          <span class="status-badge ${statusKey}">${ticket.status || 'Pending'}</span>
        </div>

        <div class="details-grid">
          <div><span>Client Email</span>${userEmail}</div>
          <div><span>Preferred Time</span><strong>${ticket.pref_time || 'N/A'}</strong></div>
          <div><span>Offered Time</span><strong>${ticket.offered_time || 'None'}</strong></div>
          <div><span>Confirmed Time</span><strong style="color: var(--primary);">${ticket.accepted_time || 'Not Confirmed'}</strong></div>
          <div><span>User Notes</span>${ticket.notes || 'None'}</div>
          <div><span>Admin Reason / Comment</span>${ticket.admin_comment || 'None'}</div>
        </div>

        <div class="action-box">
          <div class="action-row">
            <div>
              <label>Accept Preferred/Offered Time Directly:</label>
              <span style="font-size: 12px; color: var(--text-muted);">Selected Slot: <strong style="color:var(--text-main);">${ticket.pref_time || ticket.offered_time || 'None'}</strong></span>
            </div>
            <button class="btn btn-accept" onclick="acceptTicket('${ticket.id}', '${ticket.pref_time || ticket.offered_time || ''}')">Accept Slot</button>
          </div>

          <hr style="border:0; border-top:1px solid var(--card-border); margin:12px 0;">

          <div class="action-row">
            <div>
              <label>Offer Alternative Slot:</label>
              <input type="datetime-local" id="slot-picker-${ticket.id}">
            </div>
            <button class="btn btn-offer" style="margin-top:16px;" onclick="offerNewSlot('${ticket.id}')">Send Offer</button>
          </div>

          <hr style="border:0; border-top:1px solid var(--card-border); margin:12px 0;">

          <div class="action-row">
            <div>
              <label>Cancel Request (Reason):</label>
              <input type="text" id="cancel-reason-${ticket.id}" placeholder="e.g., Slot unavailable">
            </div>
            <button class="btn btn-cancel" style="margin-top:16px;" onclick="cancelBooking('${ticket.id}')">Cancel Booking</button>
          </div>

          <hr style="border:0; border-top:1px solid var(--card-border); margin:12px 0;">

          <div class="action-row">
            <div>
              <label>Close Session (Notes):</label>
              <input type="text" id="close-reason-${ticket.id}" placeholder="e.g., Session completed">
            </div>
            <button class="btn btn-close" style="margin-top:16px;" onclick="closeSession('${ticket.id}')">Close Session</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function getStatusKey(status) {
    if (!status) return 'pending';
    const s = status.toLowerCase();
    if (s.includes('accept')) return 'accepted';
    if (s.includes('offered') || s.includes('slot')) return 'offered';
    if (s.includes('cancel')) return 'cancelled';
    if (s.includes('close')) return 'closed';
    return 'pending';
  }

  // --- Ticket Actions ---
  async function acceptTicket(ticketId, chosenTime) {
    if (!chosenTime) return alert("No valid time slot to accept.");
    await supabaseClient.from('tickets').update({ status: 'Accepted', accepted_time: chosenTime }).eq('id', ticketId);
    loadTickets();
  }

  async function offerNewSlot(ticketId) {
    const val = document.getElementById(`slot-picker-${ticketId}`).value;
    if (!val) return alert("Select a date/time first.");
    const formatted = new Date(val).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    await supabaseClient.from('tickets').update({ status: 'Slot Offered', offered_time: formatted }).eq('id', ticketId);
    loadTickets();
  }

  async function cancelBooking(ticketId) {
    const reason = document.getElementById(`cancel-reason-${ticketId}`).value;
    if (!reason.trim()) return alert("Enter a cancellation reason.");
    await supabaseClient.from('tickets').update({ status: 'Cancelled', admin_comment: reason }).eq('id', ticketId);
    loadTickets();
  }

  async function closeSession(ticketId) {
    const reason = document.getElementById(`close-reason-${ticketId}`).value;
    if (!reason.trim()) return alert("Enter session completion notes.");
    await supabaseClient.from('tickets').update({ status: 'Closed', admin_comment: reason }).eq('id', ticketId);
    loadTickets();
  }

  // ========================================================
  // 4. USER MANAGEMENT & ROLE TOGGLE
  // ========================================================
  async function loadUsers() {
    const { data: profiles, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .order('email', { ascending: true });

    if (error) return;
    allProfiles = profiles || [];
    renderUsers();
  }

  function renderUsers() {
    const tbody = document.getElementById('users-table-body');
    tbody.innerHTML = '';

    if (allProfiles.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No user profiles recorded yet.</td></tr>`;
      return;
    }

    allProfiles.forEach(user => {
      const isAdmin = user.role === 'admin';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${user.email}</strong></td>
        <td style="font-family: monospace; font-size: 11px; color: var(--text-muted);">${user.id}</td>
        <td>
          <span class="status-badge ${isAdmin ? 'accepted' : 'closed'}">${user.role || 'user'}</span>
        </td>
        <td>
          <button class="btn ${isAdmin ? 'btn-role demote' : 'btn-role'}" onclick="toggleUserRole('${user.id}', '${isAdmin ? 'user' : 'admin'}')">
            ${isAdmin ? 'Remove Admin' : 'Make Admin'}
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function toggleUserRole(userId, newRole) {
    const { error } = await supabaseClient
      .from('profiles')
      .update({ role: newRole })
      .eq('id', userId);

    if (error) alert('Error changing role: ' + error.message);
    else {
      await loadUsers();
      loadTickets();
    }
  }

  // ========================================================
  // 5. DIRECT MESSAGES & NOTIFICATIONS
  // ========================================================
  async function loadDMs() {
    const { data: msgs, error } = await supabaseClient
      .from('chat_messages')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) return;
    allMessages = msgs || [];
    renderThreads();
    if (activeChatUserId) renderChatWindow(activeChatUserId);
  }

  function renderThreads() {
    const container = document.getElementById('threads-list');
    container.innerHTML = '';

    const userMap = {};
    allMessages.forEach(m => {
      if (!userMap[m.user_id]) userMap[m.user_id] = [];
      userMap[m.user_id].push(m);
    });

    const userIds = Object.keys(userMap);
    if (userIds.length === 0) {
      container.innerHTML = `<div class="empty-state">No DMs received yet.</div>`;
      return;
    }

    userIds.forEach(uId => {
      const msgs = userMap[uId];
      const lastMsg = msgs[msgs.length - 1];
      const profile = allProfiles.find(p => p.id === uId);
      const email = profile ? profile.email : uId;

      const item = document.createElement('div');
      item.className = `thread-item ${activeChatUserId === uId ? 'active' : ''}`;
      item.onclick = () => selectThread(uId);
      item.innerHTML = `
        <div class="thread-email">${email}</div>
        <div class="thread-preview">${lastMsg.sender_role === 'admin' ? 'You: ' : ''}${lastMsg.message}</div>
      `;
      container.appendChild(item);
    });
  }

  function selectThread(userId) {
    activeChatUserId = userId;
    renderThreads();
    renderChatWindow(userId);
  }

  function renderChatWindow(userId) {
    const container = document.getElementById('chat-messages-container');
    container.innerHTML = '';

    const userMsgs = allMessages.filter(m => m.user_id === userId);
    const profile = allProfiles.find(p => p.id === userId);
    const email = profile ? profile.email : userId;

    if (userMsgs.length === 0) {
      container.innerHTML = `<div class="empty-state">No conversation history.</div>`;
      return;
    }

    userMsgs.forEach(m => {
      const bubble = document.createElement('div');
      const isAdmin = m.sender_role === 'admin';
      bubble.className = `chat-bubble ${isAdmin ? 'admin' : 'user'}`;
      bubble.innerHTML = `
        <span class="chat-sender-info">${isAdmin ? 'Admin' : email}</span>
        ${m.message}
      `;
      container.appendChild(bubble);
    });

    container.scrollTop = container.scrollHeight;
  }

  async function sendAdminMessage() {
    if (!activeChatUserId) return alert("Select a user thread on the left first.");
    const input = document.getElementById('admin-chat-input');
    const msg = input.value.trim();
    if (!msg) return;

    const { error } = await supabaseClient
      .from('chat_messages')
      .insert([{
        user_id: activeChatUserId,
        sender_role: 'admin',
        message: msg,
        status: 'replied'
      }]);

    if (error) alert("Error sending message: " + error.message);
    else {
      input.value = '';
      loadDMs();
    }
  }

  // ========================================================
  // 6. REALTIME SUBSCRIPTIONS
  // ========================================================
  function setupRealtime() {
    supabaseClient
      .channel('admin-tickets')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => loadTickets())
      .subscribe();

    supabaseClient
      .channel('admin-dms')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        loadDMs();
        if (payload.new && payload.new.sender_role === 'user') {
          const badge = document.getElementById('dm-notification-badge');
          const currentCount = parseInt(badge.innerText || '0') + 1;
          badge.innerText = currentCount;
          badge.classList.add('show');
        }
      })
      .subscribe((status) => {
        const conn = document.getElementById('connection-status');
        if (status === 'SUBSCRIBED') {
          conn.innerText = '● Realtime Connected';
          conn.style.color = 'var(--primary)';
        }
      });

    supabaseClient
      .channel('admin-profiles')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadUsers())
      .subscribe();
  }

  // Initialization Sequence
  async function init() {
    await loadUsers();
    await loadTickets();
    await loadDMs();
    setupRealtime();
  }

  init();
</script>
</body>
</html>
