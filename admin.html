<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Ticket & Session Control</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #3498db;
      --success: #2ecc71;
      --warning: #f39c12;
      --danger: #e74c3c;
      --neutral: #7f8c8d;
      --text-dark: #2c3e50;
      --text-muted: #6c757d;
      --border-color: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-dark); padding: 24px; }
    
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); }
    h1 { font-size: 26px; color: var(--text-dark); }
    
    /* Stats Bar */
    .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card { flex: 1; background: var(--card-bg); padding: 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-align: center; }
    .stat-number { font-size: 22px; font-weight: bold; margin-top: 4px; }

    /* Filters */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Ticket Cards */
    .ticket-list { display: flex; flex-direction: column; gap: 20px; }
    .ticket-card { background: var(--card-bg); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 6px solid var(--primary); position: relative; }
    
    /* Status Colors */
    .ticket-card.pending { border-left-color: var(--warning); }
    .ticket-card.accepted { border-left-color: var(--success); }
    .ticket-card.offered { border-left-color: var(--primary); }
    .ticket-card.cancelled { border-left-color: var(--danger); }
    .ticket-card.closed { border-left-color: var(--neutral); }

    .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ticket-title { font-size: 18px; font-weight: bold; }

    /* Badges */
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #fff; text-transform: uppercase; }
    .badge.pending { background: var(--warning); }
    .badge.accepted { background: var(--success); }
    .badge.offered { background: var(--primary); }
    .badge.cancelled { background: var(--danger); }
    .badge.closed { background: var(--neutral); }

    /* Details Grid */
    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; background: #f8f9fa; padding: 12px; border-radius: 6px; font-size: 14px; }
    .details-item span { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    
    /* Inline Action Box */
    .action-box { background: #fafbfc; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-top: 12px; }
    .action-box h4 { font-size: 14px; margin-bottom: 12px; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.5px; }

    .action-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; }
    .action-row:last-child { margin-bottom: 0; }
    
    label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; color: var(--text-muted); }
    input[type="datetime-local"], input[type="text"] { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--primary); }

    /* Buttons */
    .btn { padding: 9px 16px; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity 0.2s; color: #fff; white-space: nowrap; }
    .btn:hover { opacity: 0.88; }
    .btn-accept { background-color: var(--success); }
    .btn-offer { background-color: var(--primary); }
    .btn-cancel { background-color: var(--danger); }
    .btn-close { background-color: var(--neutral); }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 16px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Admin Booking & Session Control</h1>
    <span id="connection-status" style="font-size: 12px; color: var(--success); font-weight: bold;">● Realtime Connected</span>
  </header>

  <!-- Quick Overview Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 12px;">TOTAL TICKETS</div>
      <div class="stat-number" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--warning); font-size: 12px;">PENDING</div>
      <div class="stat-number" id="stat-pending">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--success); font-size: 12px;">CONFIRMED/ACTIVE</div>
      <div class="stat-number" id="stat-active">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--neutral); font-size: 12px;">CLOSED</div>
      <div class="stat-number" id="stat-closed">0</div>
    </div>
  </div>

  <!-- Status Filter Bar -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All Tickets</button>
    <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
    <button class="filter-btn" onclick="setFilter('accepted', this)">Accepted</button>
    <button class="filter-btn" onclick="setFilter('offered', this)">Slot Offered</button>
    <button class="filter-btn" onclick="setFilter('closed', this)">Closed</button>
  </div>

  <!-- Ticket List Container -->
  <div id="tickets-list" class="ticket-list">
    <div class="empty-state">Loading booking requests...</div>
  </div>
</div>

<script>
  // ========================================================
  // 1. CONFIGURATION & SUPABASE INITIALIZATION
  // ========================================================
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentFilter = 'all';
  let allTickets = [];

  // ========================================================
  // 2. FETCH AND RENDER TICKETS
  // ========================================================
  async function loadTickets() {
    const { data: tickets, error } = await supabase
      .from('tickets')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('tickets-list').innerHTML = `<div class="empty-state" style="color: var(--danger);">Error loading tickets: ${error.message}</div>`;
      return;
    }

    allTickets = tickets || [];
    updateStats();
    renderTickets();
  }

  function updateStats() {
    document.getElementById('stat-total').innerText = allTickets.length;
    document.getElementById('stat-pending').innerText = allTickets.filter(t => (t.status || '').toLowerCase().includes('pending')).length;
    document.getElementById('stat-active').innerText = allTickets.filter(t => t.status === 'Accepted').length;
    document.getElementById('stat-closed').innerText = allTickets.filter(t => t.status === 'Closed').length;
  }

  function setFilter(filter, element) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    renderTickets();
  }

  function renderTickets() {
    const container = document.getElementById('tickets-list');
    container.innerHTML = '';

    const filtered = allTickets.filter(t => {
      const status = (t.status || '').toLowerCase();
      if (currentFilter === 'all') return true;
      if (currentFilter === 'pending') return status.includes('pending');
      if (currentFilter === 'accepted') return status === 'accepted';
      if (currentFilter === 'offered') return status.includes('offered') || status.includes('slot');
      if (currentFilter === 'closed') return status === 'closed' || status === 'cancelled';
      return true;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">No tickets found matching "${currentFilter}".</div>`;
      return;
    }

    filtered.forEach(ticket => {
      const statusKey = getStatusKey(ticket.status);
      const card = document.createElement('div');
      card.className = `ticket-card ${statusKey}`;

      card.innerHTML = `
        <div class="ticket-header">
          <div class="ticket-title">Ticket #${ticket.ticket_number}</div>
          <span class="badge ${statusKey}">${ticket.status || 'Pending'}</span>
        </div>

        <div class="details-grid">
          <div class="details-item">
            <span>User ID</span>
            ${ticket.user_id}
          </div>
          <div class="details-item">
            <span>User Preferred Time</span>
            <strong>${ticket.pref_time || 'N/A'}</strong>
          </div>
          <div class="details-item">
            <span>Offered Time</span>
            <strong>${ticket.offered_time || 'None'}</strong>
          </div>
          <div class="details-item">
            <span>Confirmed Session Time</span>
            <strong style="color: var(--success);">${ticket.accepted_time || 'Not Confirmed'}</strong>
          </div>
          <div class="details-item">
            <span>User Notes</span>
            ${ticket.notes || 'None'}
          </div>
          <div class="details-item">
            <span>Admin Comment / Reason</span>
            ${ticket.admin_comment || 'None'}
          </div>
        </div>

        <!-- INLINE ACTION CONTROLS -->
        <div class="action-box">
          <h4>Manage Session & Time Slots</h4>

          <!-- Option 1: Accept Preferred or Current Slot -->
          <div class="action-row">
            <div>
              <label>Accept Preferred/Offered Slot Directly:</label>
              <span style="font-size: 13px; color: var(--text-dark);">
                Current Slot: <strong>${ticket.pref_time || ticket.offered_time || 'None'}</strong>
              </span>
            </div>
            <button class="btn btn-accept" onclick="acceptTicket('${ticket.id}', '${ticket.pref_time || ticket.offered_time || ''}')">
              Accept Slot
            </button>
          </div>

          <hr style="border:0; border-top: 1px solid var(--border-color); margin: 12px 0;">

          <!-- Option 2: Offer Custom Time Slot -->
          <div class="action-row">
            <div>
              <label for="slot-input-${ticket.id}">Offer Alternative Slot:</label>
              <input type="datetime-local" id="slot-input-${ticket.id}">
            </div>
            <button class="btn btn-offer" style="margin-top: 18px;" onclick="offerNewSlot('${ticket.id}')">
              Send Slot Offer
            </button>
          </div>

          <hr style="border:0; border-top: 1px solid var(--border-color); margin: 12px 0;">

          <!-- Option 3: Cancel Booking with Reason -->
          <div class="action-row">
            <div>
              <label for="cancel-reason-${ticket.id}">Cancel Booking Reason:</label>
              <input type="text" id="cancel-reason-${ticket.id}" placeholder="e.g., Slot unavailable / Requested time outside working hours">
            </div>
            <button class="btn btn-cancel" style="margin-top: 18px;" onclick="cancelBooking('${ticket.id}')">
              Cancel Booking
            </button>
          </div>

          <hr style="border:0; border-top: 1px solid var(--border-color); margin: 12px 0;">

          <!-- Option 4: Close Completed Session -->
          <div class="action-row">
            <div>
              <label for="close-reason-${ticket.id}">Close Session Notes:</label>
              <input type="text" id="close-reason-${ticket.id}" placeholder="e.g., Session completed successfully">
            </div>
            <button class="btn btn-close" style="margin-top: 18px;" onclick="closeSession('${ticket.id}')">
              Close Session
            </button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function getStatusKey(status) {
    if (!status) return 'pending';
    const s = status.toLowerCase();
    if (s.includes('accept')) return 'accepted';
    if (s.includes('offered') || s.includes('slot')) return 'offered';
    if (s.includes('cancel')) return 'cancelled';
    if (s.includes('close')) return 'closed';
    return 'pending';
  }

  // ========================================================
  // 3. ACTION HANDLERS
  // ========================================================

  // 1. Accept Slot
  async function acceptTicket(ticketId, chosenTime) {
    if (!chosenTime) {
      alert("No valid preferred or offered time exists to accept. Please offer a custom slot first.");
      return;
    }

    const { error } = await supabase
      .from('tickets')
      .update({
        status: 'Accepted',
        accepted_time: chosenTime
      })
      .eq('id', ticketId);

    if (error) alert('Error updating ticket: ' + error.message);
    else loadTickets();
  }

  // 2. Offer New Slot
  async function offerNewSlot(ticketId) {
    const input = document.getElementById(`slot-input-${ticketId}`);
    if (!input || !input.value) {
      alert('Please select a date and time before sending an offer.');
      return;
    }

    const formattedTime = new Date(input.value).toLocaleString([], {
      dateStyle: 'medium',
      timeStyle: 'short'
    });

    const { error } = await supabase
      .from('tickets')
      .update({
        status: 'Slot Offered',
        offered_time: formattedTime
      })
      .eq('id', ticketId);

    if (error) alert('Error sending slot offer: ' + error.message);
    else loadTickets();
  }

  // 3. Cancel Booking with Reason
  async function cancelBooking(ticketId) {
    const input = document.getElementById(`cancel-reason-${ticketId}`);
    const reason = input ? input.value.trim() : '';
    
    if (!reason) {
      alert('Please enter a cancellation reason.');
      return;
    }

    const { error } = await supabase
      .from('tickets')
      .update({
        status: 'Cancelled',
        admin_comment: reason
      })
      .eq('id', ticketId);

    if (error) alert('Error cancelling ticket: ' + error.message);
    else loadTickets();
  }

  // 4. Close Session
  async function closeSession(ticketId) {
    const input = document.getElementById(`close-reason-${ticketId}`);
    const reason = input ? input.value.trim() : '';

    if (!reason) {
      alert('Please provide session completion notes or a reason before closing.');
      return;
    }

    const { error } = await supabase
      .from('tickets')
      .update({
        status: 'Closed',
        admin_comment: reason
      })
      .eq('id', ticketId);

    if (error) alert('Error closing session: ' + error.message);
    else loadTickets();
  }

  // ========================================================
  // 4. REALTIME SUBSCRIPTION
  // ========================================================
  supabase
    .channel('public:tickets')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => {
      loadTickets();
    })
    .subscribe((status) => {
      const statusEl = document.getElementById('connection-status');
      if (status === 'SUBSCRIBED') {
        statusEl.innerText = '● Realtime Active';
        statusEl.style.color = 'var(--success)';
      } else {
        statusEl.innerText = '○ Connecting...';
        statusEl.style.color = 'var(--warning)';
      }
    });

  // Initial Data Fetch
  loadTickets();
</script>
</body>
</html>
